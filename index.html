<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生命遊戲培養皿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* 版面：標題、模式切換與讀數一列；挑戰模式是「格子在左、任務卡在右」，沙盒模式是整幅格子；控制列貼在格子下方 */
:root {
  --bg: #e9eff2;
  --board: #f7fafb;
  --grid: #d3dee4;
  --fg: #14303d;
  --muted: #557180;
  --cell: #1d5870;
  --newborn: #d9365e;
  --line: #b9c9d1;
  --btn: #ffffff;
  --display: "Space Grotesk", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1920; --board: #12242e; --grid: #1d3644; --fg: #dce9ef; --muted: #8aa5b2;
    --cell: #7fd1e8; --newborn: #ffb454; --line: #2c4a5a; --btn: #173140;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1920; --board: #12242e; --grid: #1d3644; --fg: #dce9ef; --muted: #8aa5b2;
  --cell: #7fd1e8; --newborn: #ffb454; --line: #2c4a5a; --btn: #173140;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 15px; line-height: 1.6;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 24px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 5vw, 38px); line-height: 1.1; margin: 0; letter-spacing: 0.02em; }
h1 small { display: block; font-family: var(--mono); font-weight: 400; font-size: 12px; letter-spacing: 0.08em; color: var(--muted); margin-top: 6px; }
dl { margin: 0; }
.readout { display: flex; gap: 22px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.readout div { display: flex; flex-direction: column; align-items: flex-end; }
.readout dt, .meter dt { font-family: var(--body); font-size: 12px; color: var(--muted); letter-spacing: 0.1em; }
.readout dd { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.1; min-width: 4ch; text-align: right; }
.modes { display: flex; }
.modes button { border-radius: 0; }
.modes button:first-child { border-radius: 4px 0 0 4px; }
.modes button:last-child { border-radius: 0 4px 4px 0; margin-left: -1px; }
.modes button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 700; }

.stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
#panel { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
@media (min-width: 860px) {
  .stage.challenge { grid-template-columns: minmax(0, 600px) minmax(0, 1fr); gap: 24px; align-items: start; }
  .stage.challenge #panel { order: 2; }
}
#board {
  display: block; width: 100%; background: var(--board);
  border: 1px solid var(--line); border-radius: 4px;
  touch-action: none; cursor: crosshair;
}
#board:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--newborn); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
button {
  font: 500 14px/1 var(--body); color: var(--fg); background: var(--btn);
  border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; min-height: 40px; cursor: pointer;
}
button:hover { border-color: var(--cell); }
#play, #next { background: var(--cell); color: var(--board); border-color: var(--cell); min-width: 5.5em; font-weight: 700; }
.speed { display: flex; align-items: center; gap: 8px; margin-left: auto; color: var(--muted); font-size: 13px; }
.speed output { font-family: var(--mono); color: var(--fg); min-width: 5.5ch; text-align: right; font-variant-numeric: tabular-nums; }
input[type="range"] { accent-color: var(--cell); width: 130px; max-width: 40vw; }
.label { font-size: 12px; letter-spacing: 0.1em; color: var(--muted); width: 100%; }
.tools button { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; }
.tools button[aria-pressed="true"], #levels button[aria-pressed="true"] { border-color: var(--cell); box-shadow: inset 0 0 0 1px var(--cell); font-weight: 700; }
.tools canvas { width: 26px; height: 26px; }
#levels button { padding: 6px 10px; min-height: 36px; font-family: var(--mono); display: inline-flex; gap: 6px; align-items: center; }
#levels .stars { font-size: 11px; letter-spacing: 1px; color: var(--newborn); }
#lvName { font-family: var(--display); font-size: 22px; line-height: 1.2; margin: 4px 0 0; }
#lvName span { font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--muted); letter-spacing: 0.08em; display: block; }
#lvGoal { margin: 0; max-width: 40ch; }
.meter { display: flex; flex-wrap: wrap; gap: 6px 24px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.meter dd { margin: 0; font-size: 18px; font-weight: 600; }
#msg { margin: 0; min-height: 3.2em; font-weight: 500; }
#msg.win { color: var(--newborn); font-weight: 700; }
#lvHint, #hint { color: var(--muted); font-size: 13px; margin: 0; }
.rules { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 6px; max-width: 62ch; }
.rules h2 { font-family: var(--display); font-size: 16px; margin: 0 0 6px; }
.rules ul { margin: 0; padding-left: 1.2em; }
.rules b { font-family: var(--mono); font-weight: 600; }
.swatch { display: inline-block; width: 0.75em; height: 0.75em; border-radius: 2px; vertical-align: baseline; margin-right: 2px; }
</style>

</head>
<body style="margin:0">
<main>
  <header>
    <h1>生命遊戲<small>CONWAY · B3/S23</small></h1>
    <div class="modes">
      <button id="modeChallenge" type="button" aria-pressed="true">挑戰關卡</button>
      <button id="modeFree" type="button" aria-pressed="false">自由沙盒</button>
    </div>
    <dl class="readout">
      <div><dt>世代</dt><dd id="gen">0</dd></div>
      <div><dt>存活</dt><dd id="pop">0</dd></div>
    </dl>
  </header>

  <div class="stage challenge" id="stage">
    <aside id="panel">
      <div class="row" id="levels"></div>
      <h2 id="lvName"></h2>
      <p id="lvGoal"></p>
      <dl class="meter">
        <div><dt>已放細胞</dt><dd id="used">0 / 0</dd></div>
        <div><dt>進度</dt><dd id="prog">0 / 0 代</dd></div>
        <div><dt>三星條件</dt><dd id="par">—</dd></div>
      </dl>
      <p id="msg" role="status"></p>
      <div class="row">
        <button id="next" type="button" hidden>下一關</button>
        <button id="hintBtn" type="button">看提示</button>
      </div>
      <p id="lvHint" hidden></p>
    </aside>
    <canvas id="board" tabindex="0" aria-label="細胞格子，點擊或拖曳來放置細胞"></canvas>
  </div>

  <div class="row">
    <button id="play" type="button">開始演化</button>
    <button id="step" type="button">下一代</button>
    <button id="random" type="button">隨機撒種</button>
    <button id="clear" type="button">清空</button>
    <label class="speed" for="speed">速度
      <input id="speed" type="range" min="1" max="30" value="15">
      <output id="speedOut" for="speed">15 代/秒</output>
    </label>
  </div>

  <div class="row tools" id="tools"><span class="label">選一種筆，再點格子</span></div>
  <p id="hint"></p>

  <section class="rules">
    <h2>規則只有三條</h2>
    <ul>
      <li>空格周圍剛好有 <b>3</b> 個活細胞，就誕生一個新細胞（<span class="swatch" style="background:var(--newborn)"></span>剛出生的顏色）。</li>
      <li>活細胞周圍有 <b>2</b> 或 <b>3</b> 個鄰居，就繼續活著（<span class="swatch" style="background:var(--cell)"></span>）。</li>
      <li>其他情況都會死：鄰居太少是孤單，太多是擁擠。</li>
    </ul>
  </section>
</main>

<script>
(() => {
  const PATTERNS = [
    { id: 'pen', name: '單一細胞', hint: '點一下放或擦掉一個細胞，按住拖曳可以連續畫。', rows: ['O'] },
    { id: 'glider', name: '滑翔機', hint: '每 4 代往斜下方移動一格，會一路飛過邊界再從另一側回來。', rows: ['.O.', '..O', 'OOO'] },
    { id: 'lwss', name: '輕型太空船', hint: '水平飛行的太空船，每 4 代前進 2 格。', rows: ['.O..O', 'O....', 'O...O', 'OOOO.'] },
    { id: 'blinker', name: '信號燈', hint: '最小的振盪器，橫豎交替，週期 2。', rows: ['OOO'] },
    { id: 'pulsar', name: '脈衝星', hint: '週期 3 的大型振盪器，像在呼吸。', rows: [
      '..OOO...OOO..', '.............', 'O....O.O....O', 'O....O.O....O', 'O....O.O....O', '..OOO...OOO..', '.............',
      '..OOO...OOO..', 'O....O.O....O', 'O....O.O....O', 'O....O.O....O', '.............', '..OOO...OOO..'] },
    { id: 'penta', name: '十五週期振盪器', hint: '一條細長的振盪器，15 代才循環一次。', rows: ['..O....O..', 'OO.OOOO.OO', '..O....O..'] },
    { id: 'rpent', name: 'R 五連塊', hint: '只有 5 個細胞，卻會混亂演化上千代才穩定。', rows: ['.OO', 'OO.', '.O.'] },
    { id: 'gun', name: '滑翔機槍', hint: '高斯帕滑翔機槍，每 30 代射出一架滑翔機。', rows: [
      '........................O...........', '......................O.O...........', '............OO......OO............OO',
      '...........O...O....OO............OO', 'OO........O.....O...OO..............', 'OO........O...O.OO....O.O...........',
      '..........O.....O.......O...........', '...........O...O....................', '............OO......................'] },
  ];
  const BEEHIVE = ['.OO.', 'O..O', '.OO.'], GLIDER = ['.O.', '..O', 'OOO'];

  // 挑戰關卡：40×40、邊界外是死的。區域座標為 [x1, y1, x2, y2]（含邊）。par = [三星上限, 二星上限]
  const LEVELS = [
    { name: '活下來', type: 'survive', budget: 6, maxGen: 30, par: [3, 4],
      goal: '放最多 6 個細胞，讓族群撐到第 30 代還有細胞活著。',
      hint: '三個排成一直線的細胞會永遠來回閃爍；2×2 的方塊則完全不動。' },
    { name: '清場', type: 'extinct', budget: 4, maxGen: 60, par: [2, 3], preset: [[BEEHIVE, 18, 18]],
      goal: '場上有一個穩定不動的「蜂巢」。加最多 4 個細胞，讓全場在 60 代內死光。',
      hint: '單獨一個細胞影響不了它。試試在蜂巢正上方隔一格的地方放兩個細胞，中間空一格。' },
    { name: '飛過去', type: 'reach', budget: 8, maxGen: 140, par: [5, 6], zone: [2, 2, 11, 11], targets: [[30, 30, 36, 36]],
      goal: '只能在放置區放最多 8 個細胞，讓活細胞在 140 代內碰到右下角的目標區。',
      hint: '滑翔機只要 5 個細胞：第一排放中間、第二排放右邊、第三排三格全放，它會往右下飛。' },
    { name: '人口爆炸', type: 'grow', goalPop: 80, budget: 7, maxGen: 120, par: [5, 6],
      goal: '放最多 7 個細胞，在 120 代內讓存活數衝到 80。',
      hint: '在場地中央放「R 五連塊」：第一排放右邊兩格、第二排放左邊兩格、第三排放中間一格。' },
    { name: '兵分兩路', type: 'reach', budget: 14, maxGen: 100, par: [10, 12], zone: [15, 15, 24, 24], targets: [[2, 2, 7, 7], [32, 32, 37, 37]],
      goal: '在中央放置區放最多 14 個細胞，100 代內左上和右下兩個目標區都要碰到。',
      hint: '需要兩架滑翔機。把往右下飛的滑翔機上下、左右都翻過來，它就會往左上飛。兩架別靠太近。' },
    { name: '守護基地', type: 'protect', budget: 6, maxGen: 160, par: [3, 4], zone: [12, 12, 26, 26], protect: [29, 29, 34, 33],
      preset: [[GLIDER, 4, 4], [BEEHIVE, 30, 30]],
      goal: '一架滑翔機正飛向右下角的基地。在放置區放最多 6 個細胞，讓基地到第 160 代都完好如初。',
      hint: '在滑翔機的斜線航道上放一個 2×2 方塊把它擋下來。其實放 L 形的三個細胞，下一代就會自己長成方塊。' },
  ];

  const $ = (id) => document.getElementById(id);
  const canvas = $('board'), ctx = canvas.getContext('2d');
  const narrow = window.innerWidth < 560;
  const FREE_COLS = narrow ? 40 : 72, FREE_ROWS = narrow ? 48 : 42, CH = 40;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let COLS = CH, ROWS = CH, wrap = false;
  let cells, next;                 // 0 = 死，1 = 剛出生／玩家放的，2 = 存活超過一代／關卡預設
  let gen = 0, playing = false, speed = 15, tool = PATTERNS[0], cell = 10;
  let mode = null, freeSave = null;
  // 挑戰狀態
  let lvl = 0, phase = 'setup', placed = new Uint8Array(CH * CH), presetMask = new Uint8Array(CH * CH);
  let used = 0, hits = [], maxPop = 0, baseSnap = null, stars = [0, 0, 0, 0, 0, 0];
  try { const s = JSON.parse(localStorage.getItem('life-stars')); if (Array.isArray(s)) stars = LEVELS.map((_, i) => s[i] | 0); } catch (e) {}

  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const L = () => LEVELS[lvl];
  const inRect = (x, y, r) => x >= r[0] && y >= r[1] && x <= r[2] && y <= r[3];

  function setBoard(c, r, w) { COLS = c; ROWS = r; wrap = w; cells = new Uint8Array(c * r); next = new Uint8Array(c * r); }

  function stamp(p, cx, cy) {
    const h = p.rows.length, w = p.rows[0].length;
    const ox = cx - (w >> 1), oy = cy - (h >> 1);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (p.rows[y][x] === 'O') cells[((oy + y + ROWS) % ROWS) * COLS + (ox + x + COLS) % COLS] = 1;
    }
  }

  function alive(x, y) {
    if (wrap) return cells[((y + ROWS) % ROWS) * COLS + (x + COLS) % COLS] > 0;
    return x >= 0 && y >= 0 && x < COLS && y < ROWS && cells[y * COLS + x] > 0;
  }
  function step() {
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const n = alive(x - 1, y - 1) + alive(x, y - 1) + alive(x + 1, y - 1) + alive(x - 1, y)
              + alive(x + 1, y) + alive(x - 1, y + 1) + alive(x, y + 1) + alive(x + 1, y + 1);
      const i = y * COLS + x;
      next[i] = cells[i] > 0 ? (n === 2 || n === 3 ? 2 : 0) : (n === 3 ? 1 : 0);
    }
    [cells, next] = [next, cells];
    gen++;
  }

  // ───── 繪圖 ─────
  function layout() {
    const w = canvas.clientWidth, dpr = window.devicePixelRatio || 1;
    cell = w / COLS;
    canvas.style.height = cell * ROWS + 'px';
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(cell * ROWS * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  function region(r, color, label, fillAlpha, dashed) {
    const x = r[0] * cell, y = r[1] * cell, w = (r[2] - r[0] + 1) * cell, h = (r[3] - r[1] + 1) * cell;
    ctx.fillStyle = color; ctx.globalAlpha = fillAlpha; ctx.fillRect(x, y, w, h); ctx.globalAlpha = 1;
    ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash(dashed ? [5, 4] : []);
    ctx.strokeRect(x + 0.75, y + 0.75, w - 1.5, h - 1.5); ctx.setLineDash([]);
    ctx.font = '500 11px ' + css('--body'); ctx.textBaseline = 'bottom';
    ctx.fillText(label, x + 1, y - 2);
  }
  function draw() {
    const w = cell * COLS, h = cell * ROWS;
    ctx.fillStyle = css('--board');
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = css('--grid');
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 1; x < COLS; x++) { const px = Math.round(x * cell) + 0.5; ctx.moveTo(px, 0); ctx.lineTo(px, h); }
    for (let y = 1; y < ROWS; y++) { const py = Math.round(y * cell) + 0.5; ctx.moveTo(0, py); ctx.lineTo(w, py); }
    ctx.stroke();
    if (mode === 'challenge') {
      const lv = L();
      if (lv.zone) region(lv.zone, css('--cell'), '放置區', 0.07, true);
      (lv.targets || []).forEach((t, i) => region(t, css('--newborn'), hits[i] ? '命中！' : '目標', hits[i] ? 0.4 : 0.12, false));
      if (lv.protect) region(lv.protect, css('--muted'), '基地', 0.1, false);
    }
    const colors = [null, css('--newborn'), css('--cell')];
    const pad = cell > 7 ? 1.5 : 1;
    let pop = 0;
    for (let s = 1; s <= 2; s++) {
      ctx.fillStyle = colors[s];
      for (let i = 0; i < cells.length; i++) {
        if (cells[i] !== s) continue;
        pop++;
        ctx.fillRect((i % COLS) * cell + pad, ((i / COLS) | 0) * cell + pad, cell - pad * 2 + 1, cell - pad * 2 + 1);
      }
    }
    $('gen').textContent = gen;
    $('pop').textContent = pop;
    if (mode === 'challenge') {
      $('used').textContent = used + ' / ' + L().budget;
      $('prog').textContent = gen + ' / ' + L().maxGen + ' 代';
    }
  }

  // ───── 播放迴圈 ─────
  let last = 0, acc = 0;
  function frame(t) {
    if (!playing) return;
    acc += Math.min(t - last, 250); last = t;
    const interval = 1000 / speed;
    let moved = false;
    while (playing && acc >= interval) {
      step(); acc -= interval; moved = true;
      if (mode === 'challenge') judge();
    }
    if (moved) draw();
    if (playing) requestAnimationFrame(frame);
  }
  function playLabel() {
    $('play').textContent = mode === 'challenge' ? (phase === 'setup' ? '開始演化' : '重新佈置') : (playing ? '暫停' : '播放');
  }
  function setPlaying(on) {
    playing = on;
    playLabel();
    if (on) { last = performance.now(); acc = 0; requestAnimationFrame(frame); }
  }

  // ───── 挑戰模式 ─────
  function say(text, win) { $('msg').textContent = text; $('msg').classList.toggle('win', !!win); }
  function starText(n) { return '★'.repeat(n) + '☆'.repeat(3 - n); }
  function renderLevels() {
    const box = $('levels');
    box.textContent = '';
    LEVELS.forEach((lv, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.id = 'lv-' + (i + 1);
      b.setAttribute('aria-pressed', i === lvl);
      b.setAttribute('aria-label', '第 ' + (i + 1) + ' 關 ' + lv.name + '，' + stars[i] + ' 星');
      const s = document.createElement('span'); s.className = 'stars'; s.textContent = starText(stars[i]);
      b.append(String(i + 1), s);
      b.addEventListener('click', () => loadLevel(i));
      box.append(b);
    });
  }
  function toSetup() {
    setPlaying(false);
    cells.fill(0); presetMask.fill(0);
    (L().preset || []).forEach(([rows, px, py]) => rows.forEach((row, j) => [...row].forEach((ch, i) => {
      if (ch === 'O') { cells[(py + j) * CH + px + i] = 2; presetMask[(py + j) * CH + px + i] = 1; }
    })));
    for (let i = 0; i < placed.length; i++) if (placed[i]) cells[i] = 1;
    gen = 0; phase = 'setup'; hits = []; maxPop = 0;
    $('next').hidden = true;
    playLabel(); draw();
  }
  function loadLevel(i) {
    lvl = i; placed.fill(0); used = 0;
    const lv = L();
    $('lvName').innerHTML = '<span>第 ' + (i + 1) + ' 關 / 共 ' + LEVELS.length + ' 關</span>';
    $('lvName').append(lv.name);
    $('lvGoal').textContent = lv.goal;
    $('par').textContent = lv.par[0] + ' 個以內';
    $('lvHint').textContent = lv.hint; $('lvHint').hidden = true; $('hintBtn').textContent = '看提示';
    say(lv.zone ? '在虛線框的放置區裡點格子放細胞，再按「開始演化」。' : '點格子放細胞，再按「開始演化」。');
    renderLevels();
    toSetup();
  }
  function finish(won, text) {
    setPlaying(false);
    phase = won ? 'won' : 'lost';
    if (won) {
      const lv = L(), got = used <= lv.par[0] ? 3 : used <= lv.par[1] ? 2 : 1;
      if (got > stars[lvl]) { stars[lvl] = got; try { localStorage.setItem('life-stars', JSON.stringify(stars)); } catch (e) {} }
      renderLevels();
      let t = '過關 ' + starText(got) + '　用了 ' + used + ' 個細胞，第 ' + gen + ' 代達成。';
      if (got < 3) t += '只用 ' + lv.par[0] + ' 個以內可以拿三星。';
      else if (lvl === LEVELS.length - 1) t += stars.every((s) => s === 3) ? '全部三星，你已經是培養皿大師了！' : '最後一關也過了！';
      say(t, true);
      $('next').hidden = lvl === LEVELS.length - 1;
    } else {
      say(text + ' 按「重新佈置」調整一下再試。');
    }
    playLabel();
  }
  function judge() {
    if (phase !== 'run') return;
    const lv = L();
    let pop = 0;
    for (let i = 0; i < cells.length; i++) if (cells[i]) pop++;
    if (pop > maxPop) maxPop = pop;
    const timeUp = gen >= lv.maxGen;
    if (lv.type === 'extinct') {
      if (pop === 0) return finish(true);
      if (timeUp) return finish(false, lv.maxGen + ' 代過去了，場上還有 ' + pop + ' 個細胞。');
      return;
    }
    if (lv.type === 'reach') {
      lv.targets.forEach((t, k) => {
        if (hits[k]) return;
        for (let y = t[1]; y <= t[3] && !hits[k]; y++) for (let x = t[0]; x <= t[2]; x++) if (cells[y * CH + x]) { hits[k] = true; break; }
      });
      if (lv.targets.every((_, k) => hits[k])) return finish(true);
      if (pop === 0) return finish(false, '細胞在第 ' + gen + ' 代全滅了，還沒碰到目標。');
      if (timeUp) return finish(false, '時間到，還有目標沒碰到。');
      return;
    }
    if (lv.type === 'grow') {
      if (pop >= lv.goalPop) return finish(true);
      if (pop === 0) return finish(false, '細胞在第 ' + gen + ' 代全滅了。');
      if (timeUp) return finish(false, '時間到，最多只長到 ' + maxPop + ' 個。');
      return;
    }
    if (lv.type === 'survive') {
      if (pop === 0) return finish(false, '細胞在第 ' + gen + ' 代全滅了。');
      if (timeUp) return finish(true);
      return;
    }
    if (lv.type === 'protect') {
      if (!timeUp) return;
      const r = lv.protect;
      for (let y = r[1]; y <= r[3]; y++) for (let x = r[0]; x <= r[2]; x++) {
        if ((cells[y * CH + x] > 0) !== (baseSnap[y * CH + x] > 0)) return finish(false, '基地被破壞了。');
      }
      return finish(true);
    }
  }
  function startRun() {
    if (!used) { say('先在格子上放至少一個細胞。'); return; }
    baseSnap = cells.slice();
    phase = 'run';
    say('演化中…');
    setPlaying(true);
  }
  function place(c, value) {
    const lv = L();
    if (presetMask[c.i]) return;
    if (lv.zone && !inRect(c.x, c.y, lv.zone)) { say('只能放在虛線框的放置區裡。'); return; }
    if (value && !placed[c.i]) {
      if (used >= lv.budget) { say('細胞用完了（上限 ' + lv.budget + ' 個）。點已經放的細胞可以收回。'); return; }
      placed[c.i] = 1; cells[c.i] = 1; used++;
    } else if (!value && placed[c.i]) {
      placed[c.i] = 0; cells[c.i] = 0; used--;
    }
  }

  // ───── 指標操作 ─────
  let painting = false, paintValue = 1, lastIdx = -1;
  function cellAt(e) {
    const r = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) / r.width * COLS), y = Math.floor((e.clientY - r.top) / r.height * ROWS);
    return (x < 0 || y < 0 || x >= COLS || y >= ROWS) ? null : { x, y, i: y * COLS + x };
  }
  canvas.addEventListener('pointerdown', (e) => {
    const c = cellAt(e); if (!c) return;
    e.preventDefault();
    if (mode === 'challenge') {
      if (phase !== 'setup') { if (phase === 'run') say('演化中不能改。按「重新佈置」回到擺放階段。'); return; }
      painting = true; paintValue = placed[c.i] ? 0 : 1; lastIdx = c.i;
      place(c, paintValue);
      canvas.setPointerCapture(e.pointerId);
    } else if (tool.id === 'pen') {
      painting = true; paintValue = cells[c.i] ? 0 : 1; cells[c.i] = paintValue; lastIdx = c.i;
      canvas.setPointerCapture(e.pointerId);
    } else {
      stamp(tool, c.x, c.y);
    }
    draw();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!painting) return;
    const c = cellAt(e); if (!c || c.i === lastIdx) return;
    lastIdx = c.i;
    if (mode === 'challenge') place(c, paintValue); else cells[c.i] = paintValue;
    draw();
  });
  const stopPaint = () => { painting = false; lastIdx = -1; };
  canvas.addEventListener('pointerup', stopPaint);
  canvas.addEventListener('pointercancel', stopPaint);

  // ───── 沙盒的圖案庫 ─────
  const tools = $('tools');
  function thumb(cv, p) {
    const dpr = window.devicePixelRatio || 1, S = 26;
    cv.width = cv.height = S * dpr;
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, S, S);
    const h = p.rows.length, w = p.rows[0].length, u = Math.min(6, (S - 2) / Math.max(w, h));
    const ox = (S - w * u) / 2, oy = (S - h * u) / 2;
    c.fillStyle = css('--cell');
    p.rows.forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch === 'O') c.fillRect(ox + x * u, oy + y * u, Math.max(u - 0.6, 0.6), Math.max(u - 0.6, 0.6));
    }));
  }
  function drawThumbs() { tools.querySelectorAll('button').forEach((b, i) => thumb(b.firstChild, PATTERNS[i])); }
  function selectTool(p) {
    tool = p;
    tools.querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-pressed', PATTERNS[i] === p));
    $('hint').textContent = p.hint;
  }
  PATTERNS.forEach((p) => {
    const b = document.createElement('button');
    b.type = 'button'; b.id = 'tool-' + p.id;
    b.append(document.createElement('canvas'), p.name);
    b.addEventListener('click', () => selectTool(p));
    tools.append(b);
  });

  // ───── 模式切換 ─────
  function setMode(m) {
    if (mode === m) return;
    if (mode === 'free') freeSave = { cells: cells.slice(), gen };
    setPlaying(false);
    mode = m;
    const ch = m === 'challenge';
    $('modeChallenge').setAttribute('aria-pressed', ch);
    $('modeFree').setAttribute('aria-pressed', !ch);
    $('stage').classList.toggle('challenge', ch);
    $('panel').hidden = !ch;
    ['step', 'random', 'tools', 'hint'].forEach((id) => { $(id).hidden = ch; });
    if (ch) {
      setBoard(CH, CH, false);
      loadLevel(lvl);
      layout();
    } else {
      setBoard(FREE_COLS, FREE_ROWS, true);
      if (freeSave) { cells.set(freeSave.cells); gen = freeSave.gen; }
      else {
        // 沙盒開場範例：一把滑翔機槍，加上脈衝星與太空船
        const by = (id) => PATTERNS.find((p) => p.id === id);
        gen = 0;
        stamp(by('gun'), 20, 6);
        stamp(by('pulsar'), narrow ? 10 : 14, ROWS - 12);
        stamp(by('lwss'), COLS - 8, ROWS - 6);
        if (!narrow) stamp(by('penta'), COLS - 14, 8);
      }
      drawThumbs();
      layout();
      setPlaying(!reducedMotion);
    }
  }

  $('modeChallenge').addEventListener('click', () => setMode('challenge'));
  $('modeFree').addEventListener('click', () => setMode('free'));
  $('play').addEventListener('click', () => {
    if (mode === 'free') return setPlaying(!playing);
    if (phase === 'setup') startRun();
    else { toSetup(); say('調整細胞後，再按「開始演化」。'); }
  });
  $('step').addEventListener('click', () => { setPlaying(false); step(); draw(); });
  $('clear').addEventListener('click', () => {
    if (mode === 'challenge') { placed.fill(0); used = 0; toSetup(); say('已清空你放的細胞。'); return; }
    cells.fill(0); gen = 0; setPlaying(false); draw();
  });
  $('random').addEventListener('click', () => {
    for (let i = 0; i < cells.length; i++) cells[i] = Math.random() < 0.28 ? 1 : 0;
    gen = 0; draw();
  });
  $('next').addEventListener('click', () => loadLevel(lvl + 1));
  $('hintBtn').addEventListener('click', () => {
    const h = $('lvHint'); h.hidden = !h.hidden;
    $('hintBtn').textContent = h.hidden ? '看提示' : '收起提示';
  });
  $('speed').addEventListener('input', (e) => { speed = +e.target.value; $('speedOut').textContent = speed + ' 代/秒'; });
  canvas.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); $('play').click(); } });

  const repaint = () => { draw(); drawThumbs(); };
  window.addEventListener('resize', layout);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', repaint);
  new MutationObserver(repaint).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  function start(saved) {
    selectTool(PATTERNS[0]);
    if (saved && saved.lvl >= 0 && saved.lvl < LEVELS.length) lvl = saved.lvl;
    setMode('challenge');
    if (saved && saved.placed && saved.placed.length === placed.length) {
      placed.set(saved.placed); used = placed.reduce((a, b) => a + b, 0); toSetup();
    }
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ lvl, placed: Array.from(placed) }));
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
