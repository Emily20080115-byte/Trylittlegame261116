<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>演化星球</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* 版面：星球鋪滿整個畫面；上方是讀數與時間流速，下方是分頁控制台，追蹤生物時右上角出現大腦面板。單一深色太空主題。 */
:root {
  color-scheme: dark;
  --space: #04060c;
  --panel: rgba(10, 16, 28, 0.82);
  --line: rgba(160, 190, 230, 0.2);
  --fg: #e6eef8;
  --muted: #8fa3bd;
  --sun: #ffc46b;
  --life: #6fe0b0;
  --cold: #6aa9ff;
  --display: "Space Grotesk", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--space); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.5; overflow: hidden; }
#app { position: relative; height: 100%; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
button, input { font: inherit; color: inherit; }
button {
  background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); border-radius: 4px;
  padding: 8px 12px; min-height: 36px; cursor: pointer; font-weight: 500;
}
button:hover { border-color: var(--muted); }
button[aria-pressed="true"] { background: var(--fg); color: var(--space); border-color: var(--fg); font-weight: 700; }
button.go { background: var(--life); color: #04261a; border-color: var(--life); font-weight: 700; }
button:focus-visible, input:focus-visible, #gl:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
.seg { display: flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
.seg button:last-child { border-radius: 0 4px 4px 0; }

#hud {
  position: absolute; top: 0; left: 0; right: 0; pointer-events: none;
  padding: 12px var(--gr) 0 var(--gl);
  display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 16px;
}
#hud > * { pointer-events: auto; }
h1 { font-family: var(--display); font-size: 22px; line-height: 1; margin: 0; letter-spacing: 0.04em; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 8px 0 0; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.stats div { display: flex; gap: 6px; align-items: baseline; }
.stats dt { font-family: var(--body); font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }
.stats dd { margin: 0; font-weight: 600; }
#speed button { min-width: 44px; padding: 6px 8px; background: var(--panel); }
#speed button[aria-pressed="true"] { background: var(--fg); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
#dock { position: absolute; left: var(--gl); bottom: max(16px, env(safe-area-inset-bottom, 0px)); width: 380px; max-width: calc(100% - var(--gl) - var(--gr)); }
#dock .tabs { display: flex; border-bottom: 1px solid var(--line); }
#dock .tabs button { flex: 1; border: 0; border-radius: 0; background: none; color: var(--muted); border-bottom: 2px solid transparent; }
#dock .tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--sun); font-weight: 700; }
.pane { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.field { display: grid; grid-template-columns: 5.5em minmax(0, 1fr) 6em; align-items: center; gap: 8px; }
.field output { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; font-size: 13px; }
input[type="range"] { width: 100%; accent-color: var(--sun); }
.note { color: var(--muted); font-size: 12px; margin: 0; }
.rowb { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#splist { display: flex; flex-direction: column; gap: 4px; max-height: 150px; overflow-y: auto; }
#splist button { display: grid; grid-template-columns: 12px 4.5em 3em minmax(0, 1fr); gap: 8px; align-items: center; text-align: left; padding: 5px 8px; min-height: 32px; border-color: transparent; }
#splist button:hover { border-color: var(--line); }
#splist .dot { width: 10px; height: 10px; border-radius: 50%; }
#splist .n { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
#splist .tags { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#brain { position: absolute; right: var(--gr); top: 76px; width: 330px; max-width: calc(100% - var(--gl) - var(--gr)); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
#brain h2 { font-family: var(--display); font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
#brain h2 i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
#bTags { color: var(--muted); font-size: 12px; margin: 0; }
#bThought { margin: 0; font-weight: 500; color: var(--sun); min-height: 1.5em; }
#bStats { display: flex; flex-wrap: wrap; gap: 2px 14px; font-family: var(--mono); font-size: 12px; margin: 0; font-variant-numeric: tabular-nums; }
#bStats span { color: var(--muted); font-family: var(--body); margin-right: 4px; }
#bNet { width: 100%; height: 190px; display: block; }
#toast { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); padding: 10px 16px; max-width: 80%; text-align: center; pointer-events: none; }
#fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
@media (max-width: 640px) {
  #dock { left: 0; right: 0; bottom: 0; width: auto; max-width: none; border-radius: 6px 6px 0 0; border-width: 1px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .pane { padding: 10px var(--gr) 12px var(--gl); }
  #brain { top: 116px; left: var(--gl); right: var(--gr); width: auto; max-width: none; padding: 10px; gap: 4px; }
  #bNet { height: 156px; }
  #bTags { display: none; }
  #splist { max-height: 104px; }
}
</style>

</head>
<body style="margin:0">
<div id="app">
  <canvas id="gl" tabindex="0" aria-label="星球畫面：拖曳旋轉、滾輪或兩指縮放、點生物開始追蹤"></canvas>

  <div id="hud">
    <div>
      <h1>演化星球</h1>
      <dl class="stats">
        <div><dt>人口</dt><dd id="sPop">0</dd></div>
        <div><dt>物種</dt><dd id="sSp">0</dd></div>
        <div><dt>世代</dt><dd id="sGen">0</dd></div>
        <div><dt>年</dt><dd id="sYear">0</dd></div>
        <div><dt>均溫</dt><dd id="sTemp">15°C</dd></div>
      </dl>
    </div>
    <div class="seg" id="speed" role="group" aria-label="時間流速">
      <button type="button" data-v="0" aria-pressed="false">暫停</button>
      <button type="button" data-v="1" aria-pressed="false">1×</button>
      <button type="button" data-v="4" aria-pressed="true">4×</button>
      <button type="button" data-v="16" aria-pressed="false">16×</button>
    </div>
  </div>

  <section id="brain" class="card" hidden aria-live="off">
    <h2><i id="bDot"></i><span id="bName"></span></h2>
    <p id="bTags"></p>
    <p id="bThought"></p>
    <p id="bStats"></p>
    <canvas id="bNet" aria-label="這隻生物的神經網路即時活動"></canvas>
    <div class="rowb"><button type="button" id="bBack">回到太空</button><button type="button" id="bNext">換一隻同類</button></div>
  </section>

  <section id="dock" class="card">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-land" aria-selected="true" data-pane="pane-land">地形</button>
      <button type="button" role="tab" id="tab-env" aria-selected="false" data-pane="pane-env">環境</button>
      <button type="button" role="tab" id="tab-life" aria-selected="false" data-pane="pane-life">生物</button>
    </div>
    <div class="pane" id="pane-land">
      <div class="seg" id="tools" role="group" aria-label="工具">
        <button type="button" data-tool="look" aria-pressed="true">觀察</button>
        <button type="button" data-tool="raise" aria-pressed="false">隆起</button>
        <button type="button" data-tool="dig" aria-pressed="false">下挖</button>
      </div>
      <label class="field" for="brush">筆刷大小<input id="brush" type="range" min="4" max="30" value="12"><output id="brushOut" for="brush">中</output></label>
      <p class="note" id="toolNote">拖曳旋轉星球，滾輪或兩指縮放。點一隻生物就能貼近追蹤牠。</p>
    </div>
    <div class="pane" id="pane-env" hidden>
      <label class="field" for="sun">太陽距離<input id="sun" type="range" min="0.75" max="1.4" step="0.01" value="1"><output id="sunOut" for="sun">1.00 AU</output></label>
      <label class="field" for="atm">大氣濃度<input id="atm" type="range" min="0" max="2" step="0.02" value="1"><output id="atmOut" for="atm">1.00 倍</output></label>
      <p class="note" id="envNote"></p>
      <div class="rowb"><button type="button" id="newPlanet">換一顆新星球</button></div>
    </div>
    <div class="pane" id="pane-life" hidden>
      <div class="rowb"><button type="button" class="go" id="drop">投放一批原始生物</button><span class="note" id="dropNote">投放在畫面正中央的位置</span></div>
      <div id="splist" aria-label="目前數量最多的物種，點一下追蹤"></div>
    </div>
  </section>

  <div id="toast" class="card" role="status" hidden></div>
  <div id="fail" hidden><p>這個瀏覽器無法啟動 3D 繪圖（WebGL），所以星球畫不出來。請換一個瀏覽器或裝置再試。</p></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// 演化模擬核心：不依賴畫面，星球表面用經緯網格存高度、食物與氣溫
function createSim(opts) {
  const GW = 256, GH = 128, FW = 128, FH = 64, MAXN = opts.maxN || 420;
  const NI = 12, NH = 8, NO = 3, NW = NI * NH + (NH + 1) * NO;
  const SENSE = 0.1, PI = Math.PI;
  let seed = opts.seed || 1, nseed = (opts.seed || 1) * 7919;
  function rnd() { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
  function gauss() { return (rnd() + rnd() + rnd() + rnd() - 2) * 1.73; }
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  // ── 地形雜訊 ──
  function h3(x, y, z) { let n = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177) ^ nseed; n = Math.imul(n ^ n >>> 13, 1103515245); return ((n ^ n >>> 16) >>> 0) / 4294967296; }
  function vnoise(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    let fx = x - xi, fy = y - yi, fz = z - zi;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
    const l = (a, b, t) => a + (b - a) * t;
    return l(l(l(h3(xi, yi, zi), h3(xi + 1, yi, zi), fx), l(h3(xi, yi + 1, zi), h3(xi + 1, yi + 1, zi), fx), fy),
             l(l(h3(xi, yi, zi + 1), h3(xi + 1, yi, zi + 1), fx), l(h3(xi, yi + 1, zi + 1), h3(xi + 1, yi + 1, zi + 1), fx), fy), fz) * 2 - 1;
  }
  function fbm(x, y, z, oct) { let a = 0.5, s = 0, f = 1; for (let o = 0; o < oct; o++) { s += a * vnoise(x * f + o * 17, y * f - o * 11, z * f + o * 5); a *= 0.5; f *= 2.05; } return s; }

  // ── 網格 ──
  const hgt = new Float32Array(GW * GH), cellVec = new Float32Array(GW * GH * 3);
  const food = new Float32Array(FW * FH), cap = new Float32Array(FW * FH), temp = new Float32Array(FW * FH), hF = new Float32Array(FW * FH), cosL = new Float32Array(FH);
  for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
    const lat = (0.5 - (j + 0.5) / GH) * PI, lon = ((i + 0.5) / GW - 0.5) * 2 * PI, k = (j * GW + i) * 3;
    cellVec[k] = Math.cos(lat) * Math.cos(lon); cellVec[k + 1] = Math.sin(lat); cellVec[k + 2] = Math.cos(lat) * Math.sin(lon);
  }
  for (let j = 0; j < FH; j++) cosL[j] = Math.cos((0.5 - (j + 0.5) / FH) * PI);
  const climate = { sunDist: 1, atm: 1, mean: 15 };
  let climateDirty = true;

  function genTerrain() {
    for (let k = 0; k < GW * GH; k++) {
      const x = cellVec[k * 3], y = cellVec[k * 3 + 1], z = cellVec[k * 3 + 2];
      let n = fbm(x * 1.5 + 3, y * 1.5, z * 1.5, 5);
      let h = n * 0.11 - 0.002;
      if (h > 0) h += Math.max(0, 0.5 - Math.abs(fbm(x * 4, y * 4 + 9, z * 4, 3))) * h * 1.6;   // 陸地上疊山脊
      hgt[k] = clamp(h, -0.09, 0.14);
    }
    climateDirty = true;
  }
  function heightAt(x, y, z) {
    let u = (Math.atan2(z, x) / (2 * PI) + 0.5) * GW - 0.5, v = (0.5 - Math.asin(clamp(y, -1, 1)) / PI) * GH - 0.5;
    v = clamp(v, 0, GH - 1.001);
    const i0 = Math.floor(u), j0 = Math.floor(v), fu = u - i0, fv = v - j0;
    const a = (i0 + GW) % GW, b = (i0 + 1 + GW) % GW, r0 = j0 * GW, r1 = (j0 + 1) * GW;
    return (hgt[r0 + a] * (1 - fu) + hgt[r0 + b] * fu) * (1 - fv) + (hgt[r1 + a] * (1 - fu) + hgt[r1 + b] * fu) * fv;
  }
  // 查食物格用的近似反三角函數（誤差遠小於一格），比 Math.atan2 / asin 快很多
  function fatan2(y, x) {
    const ax = x < 0 ? -x : x, ay = y < 0 ? -y : y, mx = ax > ay ? ax : ay; if (mx === 0) return 0;
    const a = (ax < ay ? ax : ay) / mx, s = a * a;
    let r = ((-0.0464964749 * s + 0.15931422) * s - 0.327622764) * s * a + a;
    if (ay > ax) r = 1.57079637 - r; if (x < 0) r = 3.14159274 - r; return y < 0 ? -r : r;
  }
  function fasin(y) {
    const a = y < 0 ? -y : y, r = 1.5707963 - Math.sqrt(1 - (a > 1 ? 1 : a)) * (1.5707288 + a * (-0.2121144 + a * (0.0742610 - 0.0187293 * a)));
    return y < 0 ? -r : r;
  }
  function fIdx(x, y, z) {
    let i = Math.floor((fatan2(z, x) * 0.15915494 + 0.5) * FW); if (i >= FW) i = FW - 1; if (i < 0) i = 0;
    let j = Math.floor((0.5 - fasin(y) * 0.31830989) * FH); if (j >= FH) j = FH - 1; if (j < 0) j = 0;
    return j * FW + i;
  }
  function refreshClimate() {
    climateDirty = false;
    const S = 1 / (climate.sunDist * climate.sunDist), atm = climate.atm;
    const mean = 255 * Math.pow(S, 0.25) - 273 + 33 * atm, grad = Math.max(25, 50 * (1.3 - 0.3 * atm));
    climate.mean = mean; climate.grad = grad;
    const moist = Math.min(1, 0.25 + atm * 0.75);
    for (let j = 0; j < FH; j++) {
      const sl = Math.sqrt(1 - cosL[j] * cosL[j]), band = 0.3 - sl * sl;
      for (let i = 0; i < FW; i++) {
        const k = j * FW + i, g = (j * 2) * GW + i * 2;
        const h = (hgt[g] + hgt[g + 1] + hgt[g + GW] + hgt[g + GW + 1]) * 0.25;
        hF[k] = h;
        let T, c;
        if (h > 0) { T = mean + grad * band - 350 * h; c = moist * Math.exp(-Math.pow((T - 22) / 20, 2)); }
        else { T = mean + grad * 0.8 * band; c = T < -2 ? 0 : (h > -0.03 ? 0.45 : 0.18) * Math.exp(-Math.pow((T - 16) / 22, 2)); }
        temp[k] = T; cap[k] = c * cosL[j];
      }
    }
  }
  function growFood(n) {
    for (let k = 0; k < FW * FH; k++) {
      const c = cap[k]; let f = food[k];
      if (f > c) f -= (f - c) * 0.02 * n; else f += (0.004 * f * (1 - f / (c + 1e-6)) + 0.0004 * c) * n;
      food[k] = f < 1e-6 ? 0 : f;
    }
  }
  function sculpt(x, y, z, radius, amount) {
    const cr = Math.cos(radius);
    for (let k = 0; k < GW * GH; k++) {
      const d = cellVec[k * 3] * x + cellVec[k * 3 + 1] * y + cellVec[k * 3 + 2] * z;
      if (d < cr) continue;
      const t = Math.acos(Math.min(1, d)) / radius, f = (1 - t * t) * (1 - t * t);
      hgt[k] = clamp(hgt[k] + amount * f, -0.09, 0.14);
    }
    climateDirty = true;
  }

  // ── 物種 ──
  const SYL = '卡魯米托奈沙洛菲烏澤比嵐庫瑪索林雅葛塔諾維伊布蘿'.split('');
  let creatures = [], species = [], nextSp = 1, tick = 0, totalSpecies = 0, maxGen = 0;
  function spName(g) {
    const a = SYL[Math.floor(rnd() * SYL.length)], b = SYL[Math.floor(rnd() * SYL.length)];
    const tail = g.aqua > 0.6 ? (g.size > 1.3 ? '鯨' : '魚') : g.aqua > 0.35 ? '蛙' : g.diet > 0.55 ? (g.size > 1.2 ? '獸' : '蛛') : (g.size > 1.3 ? '象' : g.size < 0.8 ? '蟲' : '鹿');
    return a + b + tail;
  }
  function newSpecies(g, parent) {
    const p = parent ? species.find((s) => s.id === parent) : null;
    const s = { id: nextSp++, parent: parent || 0, hue: p ? (p.hue + 0.11 + rnd() * 0.25) % 1 : rnd(), count: 0, born: tick,
      ref: { size: g.size, diet: g.diet, aqua: g.aqua, tpref: g.tpref, w: g.w.slice() }, name: spName(g) };
    species.push(s); totalSpecies++;
    return s;
  }
  function gdist(g, r) {
    let s = 0; for (let i = 0; i < NW; i++) { const d = g.w[i] - r.w[i]; s += d * d; }
    return Math.abs(g.size - r.size) / 0.5 + Math.abs(g.diet - r.diet) / 0.3 + Math.abs(g.aqua - r.aqua) / 0.3 + Math.abs(g.tpref - r.tpref) / 10 + Math.sqrt(s / NW) / 0.6;
  }
  function spawn(x, y, z, g, sp, energy, gen, ref) {
    let fx = rnd() - 0.5, fy = rnd() - 0.5, fz = rnd() - 0.5;
    const d = fx * x + fy * y + fz * z; fx -= d * x; fy -= d * y; fz -= d * z;
    const l = Math.sqrt(fx * fx + fy * fy + fz * fz) || 1;
    const c = { x, y, z, fx: fx / l, fy: fy / l, fz: fz / l, g, sp, ref: ref || g, e: energy, age: 0, gen, life: 1800 + rnd() * 900, dead: false,
      act: new Float32Array(NI + NH + NO), nb: 0, inWater: false, T: 0, kids: 0, kills: 0, attacking: false };
    sp.count++; creatures.push(c);
    if (gen > maxGen) maxGen = gen;
    return c;
  }
  function drop(x, y, z, n, spread) {
    let made = 0;
    for (let i = 0; i < n && creatures.length < MAXN; i++) {
      let px = x + gauss() * spread, py = y + gauss() * spread, pz = z + gauss() * spread;
      const l = Math.hypot(px, py, pz); px /= l; py /= l; pz /= l;
      const k = fIdx(px, py, pz), w = new Float32Array(NW);
      for (let j = 0; j < NW; j++) w[j] = gauss() * 0.6;
      const g = { w, size: clamp(1 + gauss() * 0.1, 0.5, 2.2), diet: clamp(0.08 + Math.abs(gauss()) * 0.14, 0, 1), aqua: clamp((hF[k] < 0 ? 0.85 : 0.15) + gauss() * 0.05, 0, 1), tpref: clamp(temp[k] + gauss() * 3, 0, 40) };
      // 同一批、同一種棲地的歸為同一個原始物種
      let sp = species.find((s) => s.batch === dropCount && s.wet === (hF[k] < 0));
      if (!sp) { sp = newSpecies(g, 0); sp.batch = dropCount; sp.wet = hF[k] < 0; }
      spawn(px, py, pz, g, sp, 1, 1); made++;
    }
    dropCount++;
    return made;
  }
  let dropCount = 0;

    bx.font = (H < 170 ? 10 : 11) + 'px "Noto Sans TC", sans-serif'; bx.textBaseline = 'middle';
    bx.textAlign = 'right';
    for (let i = 0; i < NI; i++) { node(x0, yi(i), a[i], 4.5); bx.fillStyle = '#8fa3bd'; bx.fillText(IN[i], x0 - 9, yi(i)); }
    for (let h = 0; h < NH; h++) node(x1, yh(h), a[NI + h], 5.5);
    bx.textAlign = 'left';
    for (let o = 0; o < NO; o++) { node(x2, yo(o), a[NI + NH + o], 7); bx.fillStyle = '#e6eef8'; bx.fillText(OUT[o], x2 + 12, yo(o)); }
  }

  // ───── 啟動與主迴圈 ─────
  function seedLife() {
    // 開場：挑幾個食物豐富的地點各放一小群
    let spots = 0;
    for (let tries = 0; tries < 400 && spots < 8; tries++) {
      const u = Math.random() * 2 - 1, t = Math.random() * 6.283, s = Math.sqrt(1 - u * u), x = s * Math.cos(t), y = u * 0.8, z = s * Math.sin(t), l = Math.hypot(x, y, z);
      const k = sim.fIdx(x / l, y / l, z / l);
      if (sim.cap[k] < (spots < 5 ? 0.3 : 0.12) * sim.cosL[(k / sim.FW) | 0]) continue;
      sim.drop(x / l, y / l, z / l, narrow ? 14 : 20, 0.06); spots++;
    }
  }
  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // 手機上控制台蓋住下半部，把星球往上挪一點
    if (window.innerWidth < 640) camera.setViewOffset(w, h, 0, $('dock').offsetHeight * 0.42, w, h); else camera.clearViewOffset();
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  updateVerts(); envText(); refreshColors(); seedLife(); resize(); updateCamera(true);
  let lastT = performance.now(), dayT = 20, uiT = 0, colT = 0, brainT = 0;
  function frame(now) {
    const dt = Math.min((now - lastT) / 1000, 0.05); lastT = now;
    if (speed > 0) {
      dayT += dt;
      const t0 = performance.now();
      for (let i = 0; i < speed && performance.now() - t0 < 12; i++) sim.step();
    }
    if (sculpting && sculptAt) doSculpt(dt);
    if (dirtyTerrain && now - lastClimate > 220) { sim.refreshClimate(); lastClimate = now; dirtyTerrain = sculpting; refreshColors(); }
    if (now - colT > 1500) { colT = now; refreshColors(); }
    const a = dayT * 6.283 / 100;
    sunDir.set(Math.cos(a), 0.22, Math.sin(a)).normalize();
    sunSprite.position.copy(sunDir).multiplyScalar(150); sunLight.position.copy(sunDir);
    U.time.value = dayT; U.near.value += ((sel ? 1 : 0) - U.near.value) * 0.08;
    updateCamera(false);
    drawCreatures(clamp((camera.position.length() - 1) * 0.5 + 0.3, 0.45, 1.5));
    showBrush();
    if (now - uiT > 400) { uiT = now; updateStats(); }
    if (sel && now - brainT > 90) { brainT = now; drawBrain(false); }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__planet = { sim, follow, stopFollow, orbit, sun: sunDir };
})();
</script>
